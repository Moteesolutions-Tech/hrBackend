name: CiCd Develop

on:
  push:
    branches:
      - develop

env:
  # London. Must match where the ECR repository and the EC2 instance actually are —
  # a mismatch pushes to a repository that does not exist, and asks SSM for an
  # instance it cannot see, which reports as "not in a valid state" rather than as a
  # region problem.
  AWS_DEFAULT_REGION: eu-west-2
  ECR_REPOSITORY: motee-api-dev
  # Where docker-compose.yml and .env live on the instance. Every setting the API
  # needs — connection string, signing key, CORS origins — comes from that .env, so
  # nothing environment-specific is baked into the image or this file.
  #
  # Only those two files need to be here. The deploy pulls a built image; it never
  # needs the source, which is why nothing clones the repository onto the server.
  DEPLOY_PATH: /home/ubuntu/backend

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The whole solution, not one project: Domain, Application and Infrastructure
      # are separate assemblies and the API alone would not compile the tests.
      - name: Restore NuGet packages
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore --configuration Release

  push-to-ecr:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        run: |
          IMAGE=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_DEFAULT_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}

          docker build \
            -t $IMAGE:latest \
            -t $IMAGE:${{ github.sha }} .

          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: push-to-ecr

    defaults:
      run:
        working-directory: ./

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      # Quoted heredoc delimiter, so the runner's shell leaves $(...) and $VAR alone
      # and they reach the instance intact. GitHub still substitutes ${{ }}, which
      # happens before the shell ever sees this.
      #
      # The image prune runs first, not last. It used to be the final command, after
      # the health check — so any deploy that failed never reached it, and left
      # another image behind. Three failures in a row and the disk is full, at which
      # point the SSM agent cannot write its own output files and the run comes back
      # Failed with both streams empty and nothing to debug. One bad deploy became
      # self-sustaining. Running it before the pull also frees the space at the
      # moment it is actually needed, which is the pull itself.
      #
      # until=24h keeps anything from the last day, so yesterday's image is still
      # there to roll back to.
      - name: Create SSM Parameters
        run: |
          cat >/tmp/ssm-parameters.json <<'EOF'
          {
            "commands": [
              "set -e",
              "cd ${{ env.DEPLOY_PATH }}",
              "echo 'Disk before deploy:'",
              "df -h / | tail -1",
              "echo 'Reclaiming space from old images...'",
              "docker image prune -af --filter until=24h",
              "echo 'Logging into Amazon ECR...'",
              "aws ecr get-login-password --region ${{ env.AWS_DEFAULT_REGION }} | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_DEFAULT_REGION }}.amazonaws.com",
              "echo 'Pulling latest image...'",
              "docker compose pull",
              "echo 'Recreating container...'",
              "docker compose up -d --force-recreate",
              "echo 'Waiting for the API to answer /health...'",
              "for i in $(seq 1 24); do if curl -fsS http://localhost:8080/health >/dev/null 2>&1; then echo 'API is responding.'; break; fi; sleep 5; done",
              "if ! curl -fsS http://localhost:8080/health >/dev/null 2>&1; then echo 'API did not come up within two minutes.'; docker compose ps -a; docker inspect -f 'exit={{.State.ExitCode}} error={{.State.Error}}' backend-api 2>/dev/null || true; echo 'Container output is in CloudWatch: log group /ec2/dev/backend/hr'; exit 1; fi",
              "echo 'Deployment complete.'"
            ]
          }
          EOF

      - name: Deploy via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.MOTEE_DEVELOPMENT_ENVIRONMENT_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --parameters file:///tmp/ssm-parameters.json \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          while true; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.MOTEE_DEVELOPMENT_ENVIRONMENT_INSTANCE_ID }}" \
              --query Status \
              --output text 2>/dev/null || echo Pending)

            echo "Current SSM Status: $STATUS"

            if [ "$STATUS" = "Success" ] || \
               [ "$STATUS" = "Failed" ] || \
               [ "$STATUS" = "Cancelled" ] || \
               [ "$STATUS" = "TimedOut" ]; then
              break
            fi

            sleep 10
          done

          # Printed before the output streams, because when something fails at the
          # agent level rather than inside the script, both streams come back empty
          # and these two fields are the only thing that says why — "Undeliverable"
          # for an instance SSM cannot reach, a plugin error when the agent could
          # not write its output files because the disk was full. Without them a
          # failure of that kind shows as an empty log and looks like the deploy
          # itself broke.
          echo ""
          echo "========== INVOCATION =========="

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.MOTEE_DEVELOPMENT_ENVIRONMENT_INSTANCE_ID }}" \
            --query "{Status:Status,Details:StatusDetails,ResponseCode:ResponseCode}" \
            --output table || true

          echo ""
          echo "========== REMOTE STDOUT =========="

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.MOTEE_DEVELOPMENT_ENVIRONMENT_INSTANCE_ID }}" \
            --query StandardOutputContent \
            --output text || true

          echo ""
          echo "========== REMOTE STDERR =========="

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.MOTEE_DEVELOPMENT_ENVIRONMENT_INSTANCE_ID }}" \
            --query StandardErrorContent \
            --output text || true

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment failed."
            exit 1
          fi

          echo "Deployment successful."



  trivy:
    runs-on: ubuntu-latest
    needs: push-to-ecr
    continue-on-error: true

    defaults:
      run:
        working-directory: ./

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_DEFAULT_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          format: json
          output: trivy-report.json
          exit-code: "0"
          severity: "CRITICAL,HIGH,MEDIUM,LOW"

